# Day 11 按需升级：每题都探测，探测用 Agent 提示词（search + final_answer）。
# 和 rewrite 探测的区别：不想再搜时可以直接调用 final_answer，这个答案直接用，省掉一次作答调用
extends: qwen3b_base.yaml
name: qwen3b-cascade-always-agent
method: cascade
budget: {max_search_calls: 2}
retrieval: {type: http, url: http://127.0.0.1:8100, method: dense, rerank: true}
cascade: {gate: always, probe: agent}
